apiVersion: v1
kind: Namespace
metadata:
  name: forever
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: forever
data:
  DATABASE_HOST: database
  DATABASE_PORT: "5432"
  DATABASE_NAME: app
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: forever
type: Opaque
stringData:
  POSTGRES_DB: app
  POSTGRES_USER: app
  POSTGRES_PASSWORD: change-me-before-production
