apiVersion: apps/v1
kind: Deployment
metadata:
  name: forever-backend
  namespace: forever
  labels:
    app: forever-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forever-backend
  template:
    metadata:
      labels:
        app: forever-backend
    spec:
      containers:
        - name: backend
          image: samarraghav1/forever-backend:9
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: "500m"
              memory: "500Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
          - name: MYSQL_URI
            value: mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@forever-db.c146cccu4ohk.ap-south-1.rds.amazonaws.com:27017/e-commerce
---
apiVersion: v1
kind: Service
metadata:
  name: forever-backend
  namespace: forever
spec:
  selector:
    app: forever-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: LoadBalancer
