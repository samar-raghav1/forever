apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: forever
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: samarraghav1/forever-backend:${TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: database-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: forever
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
