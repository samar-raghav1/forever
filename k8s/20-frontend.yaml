apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: forever
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: samarraghav1/forever-frontend:${Tag}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: forever
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
