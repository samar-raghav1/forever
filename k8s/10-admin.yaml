apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: forever
  labels:
    app: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: samarraghav1/forever-admin:${TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4002
          envFrom:
            - configMapRef:
                name: application-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: forever
spec:
  selector:
    app: admin
  ports:
    - name: http
      port: 80
      targetPort: http
