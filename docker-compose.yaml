services:
  
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    env_file:
      - ./frontend/.env
    restart: always
    ports:
      - "4001:80"
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin
    env_file:
      - ./admin/.env
    restart: always
    ports:
      - "4002:80"

volumes:
  mongo_data: